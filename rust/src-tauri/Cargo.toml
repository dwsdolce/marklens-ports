[package]
name = "marklens"
version = "0.1.0"
edition = "2021"

# Core logic in the library so `cargo test` exercises it against the shared
# fixtures; the Tauri binary depends on it.
[lib]
name = "marklens"
path = "src/lib.rs"

[[bin]]
name = "marklens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
comrak = "0.29"
regex = "1"
url = "2"
percent-encoding = "2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[dev-dependencies]
serde_json = "1"
