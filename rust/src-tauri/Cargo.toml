[package]
name = "marklens"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Core logic in the library so `cargo test` exercises it against the shared
# fixtures; the Tauri binary depends on it.
[lib]
name = "marklens"
path = "src/lib.rs"

# Named for the port: the bundled application is "Marklens Rust", and
# tauri.conf.json's mainBinaryName has to match what cargo produces.
[[bin]]
name = "marklens-rust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features brings comrak's own CLI and syntect, and syntect pulls
# oniguruma - a C library compiled into every build. Highlighting is done
# by highlight.js in the page, as in the other two ports, so none of it is
# used. Dropping it also lets the Windows build be checked from macOS,
# which the C code made impossible. Every extension used in renderer.rs is
# core, not feature-gated; render_cases.json proves the output is the same.
comrak = { version = "0.29", default-features = false }
regex = "1"
url = "2"
percent-encoding = "2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# Windows only, and only to turn WebView2's own accelerator keys off - see
# disable_browser_accelerators. The versions match what tauri-runtime-wry
# already locks: a second copy of either crate would make the controller a
# different type from the one Tauri hands back.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# windows-core rather than the whole `windows` crate: the only thing
# needed is the Interface trait that provides `cast`, and it has to be the
# same windows-core that webview2-com was built against (0.61) or the cast
# does not resolve. Depending on it directly says so.
windows-core = "0.61"

[dev-dependencies]
serde_json = "1"
