<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- No viewport meta. It exists so mobile browsers stop pretending to be
       980px wide, and it is inert in Chromium on the desktop - which is why
       this looked fine on WebView2. WebKitGTK does honour it, and honouring it
       means laying out to a computed viewport once and then scaling, rather
       than laying out to the window and reflowing: on Linux the toolbar wrapped
       against a width that was not the window's, and stayed wrapped when the
       window was resized. -->
  <title>Marklens</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" id="hljs-theme" href="hljs-light.css" />
  <link rel="stylesheet" href="chrome.css" />
  <script src="highlight.min.js" defer></script>
  <script src="mermaid.min.js" defer></script>
  <!-- Before main.js, and a classic script rather than a module, because the
       Qt ports load the same file into the page with a plain <script src>.
       Deferred scripts run in order, and modules run after all of them, so
       window.MarklensFind exists by the time main.js asks for it. -->
  <script src="find.js" defer></script>
  <script src="main.js" type="module" defer></script>
</head>
<body>
  <!-- Icons, order and behaviour match the Qt ports, which in turn follow the
       Swift app's toolbar. Pushed right, as its items are. The document name is
       not repeated here: the native window title already carries it.

       Open is deliberately absent, as it is in the Swift toolbar. Back is
       deliberately present, though that toolbar has none - Swift opens a link
       in a new window, while all three ports here replace the document in place
       and so need a way back. -->
  <div id="toolbar">
    <!-- The document's name, with a menu listing its path. On macOS that is
         what the title-bar proxy icon does; Windows and Linux have no such
         thing, so it is drawn here and every platform gets it in the same
         place - as it is in the Qt ports. -->
    <button id="doc-btn" hidden>
      <span class="icon" style="--i:url('icons/document.svg')"></span>
      <span id="doc-name"></span>
      <span class="caret">&#x25BE;</span>
    </button>
    <span id="toolbar-spacer"></span>
    <button data-act="back" id="back-btn" title="Back (⌘[)" disabled><span class="icon" style="--i:url('icons/back.svg')"></span><span class="label">Back</span></button>
    <button data-act="find" title="Find (⌘F)"><span class="icon" style="--i:url('icons/find.svg')"></span><span class="label">Find</span></button>
    <button data-act="zoom-out" title="Zoom Out (⌘−)"><span class="icon" style="--i:url('icons/zoom-out.svg')"></span><span class="label">Zoom Out</span></button>
    <button data-act="zoom-in" title="Zoom In (⌘=)"><span class="icon" style="--i:url('icons/zoom-in.svg')"></span><span class="label">Zoom In</span></button>
    <button data-act="zoom-reset" title="Actual Size (⌘0)"><span class="icon" style="--i:url('icons/actual-size.svg')"></span><span class="label">Actual Size</span></button>
    <button data-act="print" title="Export as PDF (⌘⇧E)"><span class="icon" style="--i:url('icons/export.svg')"></span><span class="label">Export as PDF…</span></button>
    <button data-act="reveal" id="reveal-btn"><span class="icon" style="--i:url('icons/reveal.svg')"></span><span class="label">Show in Finder</span></button>
    <button data-act="reload" id="reload-btn" title="Reload (⌘R)"><span class="icon" style="--i:url('icons/reload.svg')"></span><span class="label">Reload</span></button>
  </div>

  <!-- A bar of its own below the toolbar, as in the Swift app, with room for
       the match count and the previous/next/close buttons.

       The options and the list of matches live in a panel underneath rather
       than in the bar: four checkboxes with readable labels do not fit on one
       line, and abbreviating them to "Aa" and ".*" asks the reader to know
       what those mean. The disclosure button is the only thing the bar
       gains. -->
  <div id="findbar" hidden>
    <span class="icon findbar-glyph" style="--i:url('icons/find.svg')"></span>
    <input id="find-input" type="search" placeholder="Find" />
    <span id="find-count"></span>
    <button data-act="find-options" id="find-options-btn" title="Search options and all matches" aria-expanded="false"><span class="caret">&#x25BE;</span></button>
    <button data-act="find-prev" title="Previous match"><span class="icon" style="--i:url('icons/find-prev.svg')"></span></button>
    <button data-act="find-next" title="Next match"><span class="icon" style="--i:url('icons/find-next.svg')"></span></button>
    <button data-act="find-close" title="Close find bar"><span class="icon" style="--i:url('icons/close.svg')"></span></button>
  </div>

  <!-- Same four options and the same wording as the other two ports. -->
  <div id="find-panel" hidden>
    <div id="find-options">
      <label><input type="checkbox" id="find-case"> Case sensitive</label>
      <label><input type="checkbox" id="find-word"> Whole words only</label>
      <label title="Interpret the text as a regular expression, so that &quot;tap(s|ping)&quot; matches either word."><input type="checkbox" id="find-regex"> Regular expression</label>
      <label title="Carry on from the other end of the document when the last match is passed."><input type="checkbox" id="find-wrap" checked> Wrap around</label>
    </div>
    <div id="find-error" hidden></div>
    <ul id="find-results"></ul>
  </div>

  <!-- Both populated on demand: the path menu from the open document, the
       context menu from whatever was right-clicked. -->
  <div id="path-menu" class="popup-menu" hidden></div>
  <div id="context-menu" class="popup-menu" hidden></div>

  <article id="content"></article>

  <div id="help-overlay" hidden>
    <div id="help-panel">
      <button id="help-close" title="Close">✕</button>
      <div id="help-body"></div>
    </div>
  </div>
</body>
</html>
