<!-- Substituted into help.html by each port, as help_default_*.html is.
     Linux conventions: F5 reloads, F3 finds again. Identical to the Windows
     table today; kept separate so either can change without touching the
     substitution code in three ports. -->
<table cellpadding="4">
  <tr><td>Open file&hellip;</td><td><code>Ctrl+O</code></td></tr>
  <tr><td>Reload</td><td><code>F5</code></td></tr>
  <tr><td>Find</td><td><code>Ctrl+F</code></td></tr>
  <tr><td>Find next / previous</td><td><code>F3</code> / <code>Shift+F3</code></td></tr>
  <tr><td>Zoom in / out / actual size</td>
      <td><code>Ctrl+=</code> / <code>Ctrl+&#8722;</code> / <code>Ctrl+0</code></td></tr>
  <tr><td>Export as PDF</td><td><code>Ctrl+Shift+E</code></td></tr>
  <tr><td>Back</td><td><code>Ctrl+[</code></td></tr>
</table>
