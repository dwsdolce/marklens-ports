<ol>
  <li>Right-click any <code>.md</code> file in your file manager.</li>
  <li>Choose <b>Open With &#9656; Other Application&hellip;</b> (or
      <b>Properties &#9656; Open With</b>).</li>
  <li>Select <b>Marklens</b> and set it as the default.</li>
</ol>
<p>Or from a terminal, with a <code>marklens.desktop</code> installed:<br>
<code>xdg-mime default marklens.desktop text/markdown</code></p>
