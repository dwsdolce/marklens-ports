<ol>
  <li>Right-click any <code>.md</code> file in File Explorer.</li>
  <li>Choose <b>Open with &#9656; Choose another app</b>.</li>
  <li>Select <b>Marklens</b> (use <b>More apps &#9656; Look for another app on this
      PC</b> to locate it if it isn&rsquo;t listed).</li>
  <li>Tick <b>&ldquo;Always use this app to open .md files&rdquo;</b> and click
      <b>OK</b>.</li>
</ol>
