[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "marklens"
version = "0.1.0"
description = "A fast, native Markdown viewer — PySide6 port"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    # Also in the packaging extra below, so CI can build an installer without
    # pulling in the test tooling. Here so that one `pip install -e ".[dev]"`
    # covers everything a developer needs, including packaging/build_win.
    "pyinstaller>=6.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
marklens = "marklens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]