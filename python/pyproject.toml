[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "marklens"
version = "0.1"
description = "A fast, native Markdown viewer — PySide6 port"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
marklens = "marklens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]