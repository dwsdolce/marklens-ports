name: C++ tests

# Its own workflow because its one dependency dwarfs everything else: Qt 6 with
# WebEngine is a gigabyte-scale install, cached but still slow, and there is no
# reason for a Python or Rust change to wait behind it. The port has the most
# tests of the three - five, four of them driving a real window offscreen - so it
# also has the most to gain from being run on platforms nobody is sitting at.
#
# This is the port that had a preprocessor directive inside a QCOMPARE argument
# for two days: undefined, accepted by Clang, rejected by MSVC, so the tests had
# simply stopped compiling on Windows and nothing said so.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Qt version is per-platform, and not by preference. 6.11.1 is what
        # the ports are developed against and what Linux and macOS want: on
        # 6.10.0 the navigation test segfaults on a headless Linux runner,
        # QtWebEngine failing to make a GL context where 6.11.1 copes. Windows
        # cannot have it, because Qt 6.11 reorganised its Windows repository -
        # packages moved from a combined qt6_6111/qt6_6111/ directory into
        # per-architecture ones - and aqtinstall 3.3.0, the newest there is,
        # asks for the old path and gets a 404. So each platform takes the
        # newest version that works on it, and Windows moves up when aqtinstall
        # learns the new layout.
        include:
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            qt_version: '6.11.1'
          - os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_version: '6.10.0'
          - os: macos-latest
            qt_arch: clang_64
            qt_version: '6.11.1'

    steps:
      # Full history: CMakeLists derives the build number from
      # `git rev-list --count HEAD`, which is 1 in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WebEngine is not part of the base install and pulls in WebChannel and
      # Positioning, exactly as cpp/README.md tells a person installing Qt by
      # hand. The version comes from the matrix, for the reasons recorded there.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # QtWebEngine is Chromium, and it links against a wide set of system
      # libraries that a headless runner does not have. The offscreen platform
      # avoids needing a display; it does not avoid needing these.
      - name: System libraries for QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libasound2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libpango-1.0-0

      # The same fetch cpp/packaging/setup performs. Done here rather than by
      # running setup because setup verifies a developer's whole environment and
      # would report on things a runner arranges differently; this is the one
      # piece of it a build actually needs. CMakeLists compiles these sources
      # in-tree when no system md4c is present.
      - name: Fetch md4c
        run: git clone --depth 1 https://github.com/mity/md4c.git cpp/third_party/md4c

      - name: Configure
        run: cmake -B cpp/build -S cpp

      - name: Build
        run: cmake --build cpp/build --config Release

      # ctest supplies the offscreen platform, the sandbox flags and - since the
      # tests drive the real MainWindow, which records every document it opens -
      # a settings file inside the build tree, so nothing writes anywhere real.
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
