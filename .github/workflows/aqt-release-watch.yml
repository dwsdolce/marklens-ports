name: aqtinstall release watch

# The C++ job installs aqtinstall from an unreleased commit, because Qt 6.11
# reorganised its Windows repository and the fix - miurahr/aqtinstall#1000,
# merged 2026-03-24 - has never been in a release. 3.3.0 dates from June 2025.
#
# This watches for that to change. It FAILS when a newer release appears, which
# is deliberate and the whole mechanism: a failing scheduled run is the thing
# GitHub emails about, and a passing one is silent. Green means the pin is still
# needed and there is nothing to do; red means go and read the release notes.
#
# Its own workflow rather than a job in tests.yml, so it never runs on a push
# and never appears in the run a code change produces.

on:
  schedule:
    # Monday morning. Nothing here is urgent - the pin works - so once a week is
    # as often as this is worth hearing about.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Has aqtinstall released the Qt 6.11 Windows fix?
    runs-on: ubuntu-latest

    steps:
      # PyPI rather than the GitHub releases page: what matters is the version
      # `pip install aqtinstall` would get, which is what install-qt-action uses
      # once aqtsource goes away.
      - name: Compare the released version against the one that lacks the fix
        run: |
          latest=$(curl -fsSL https://pypi.org/pypi/aqtinstall/json \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "Latest aqtinstall on PyPI: $latest"

          # Any release after 3.3.0 necessarily carries the fix: 3.3.0 predates
          # the merge by nine months, so there is no version to exclude.
          if [ "$latest" = "3.3.0" ]; then
            echo "Still 3.3.0, which predates the fix. The aqtsource pin in"
            echo "tests.yml is still needed. Nothing to do."
            exit 0
          fi

          echo "::error::aqtinstall $latest has been released, and anything after 3.3.0 carries the Qt 6.11 Windows fix. In .github/workflows/tests.yml, replace the aqtsource line in the C++ job's Install Qt step with aqtversion: '>=$latest', and delete this workflow."
          exit 1
