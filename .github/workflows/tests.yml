name: Tests

# The ports are developed one platform at a time and the gaps are long: a month
# of macOS work landed three breakages here that a Windows or Linux runner would
# have caught in minutes - a macOS-only Tauri variant that made the Rust crate
# uncompilable elsewhere, a preprocessor directive inside a QCOMPARE argument
# that MSVC rejects and Clang accepts, and a ctest invocation that could never
# have worked on Windows. This exists to shorten that feedback loop from weeks
# to minutes.
#
# The C++ port is deliberately absent for now: Qt 6 with WebEngine is a large
# install and belongs in its own workflow once this one is green.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other two - which
      # is the whole point here, since the failures are platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Full history, not the default shallow clone. The build number is the git
      # commit count, and `git rev-list --count HEAD` returns 1 at fetch-depth 1,
      # so every port would report itself as build 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          # The floor from pyproject.toml's requires-python, not the newest:
          # testing the oldest supported interpreter is what catches a syntax or
          # stdlib call that quietly needs something later.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # QtWebEngine is Chromium, and the PySide6 wheel brings Qt but not the
      # system libraries Chromium links against. Only Linux needs this; the
      # macOS and Windows wheels are self-contained.
      - name: System libraries for QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libasound2t64

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Lint and types
        working-directory: python
        run: |
          ruff check src tests
          mypy src

      # PYTHONPATH=tests is how conftest and the GUI smoke scripts are found;
      # the offscreen platform and the sandbox flags are what let QtWebEngine
      # run on a machine with no display. test_gui.py points MARKLENS_SETTINGS
      # at a temp file per test, so nothing here touches a real settings file.
      - name: Test
        working-directory: python
        env:
          PYTHONPATH: tests
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: python -m pytest tests -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No rustfmt or clippy gate: the crate has never been rustfmt-formatted, so
      # `cargo fmt --check` fails today on line wrapping alone. Enforcing it is a
      # decision to make deliberately, with a one-time reformat commit of its
      # own - not something to discover as a red first CI run.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri

      # The same list rust/packaging/setup tells a developer to install. Only
      # Linux needs it: macOS uses WKWebView and Windows WebView2, both part of
      # the operating system.
      - name: Webview development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # cargo build before cargo test, so a compile error on this platform is
      # reported as a compile error rather than buried in test output. This is
      # the check that would have caught RunEvent::Opened, which exists only on
      # macOS and made the crate uncompilable everywhere else for ten days.
      - name: Build
        working-directory: rust/src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: rust/src-tauri
        run: cargo test --locked
