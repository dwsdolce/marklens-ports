name: Tests

# The ports are developed one platform at a time and the gaps are long: a month
# of macOS work landed three breakages here that a Windows or Linux runner would
# have caught in minutes - a macOS-only Tauri variant that made the Rust crate
# uncompilable elsewhere, a preprocessor directive inside a QCOMPARE argument
# that MSVC rejects and Clang accepts, and a ctest invocation that could never
# have worked on Windows. This exists to shorten that feedback loop from weeks
# to minutes.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other two - which
      # is the whole point here, since the failures are platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Full history, not the default shallow clone. The build number is the git
      # commit count, and `git rev-list --count HEAD` returns 1 at fetch-depth 1,
      # so every port would report itself as build 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          # The floor from pyproject.toml's requires-python, not the newest:
          # testing the oldest supported interpreter is what catches a syntax or
          # stdlib call that quietly needs something later.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # QtWebEngine is Chromium, and the PySide6 wheel brings Qt but not the
      # system libraries Chromium links against. Only Linux needs this; the
      # macOS and Windows wheels are self-contained.
      - name: System libraries for QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libasound2t64

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Lint and types
        working-directory: python
        run: |
          ruff check src tests
          mypy src

      # PYTHONPATH=tests is how conftest and the GUI smoke scripts are found;
      # the offscreen platform and the sandbox flags are what let QtWebEngine
      # run on a machine with no display. test_gui.py points MARKLENS_SETTINGS
      # at a temp file per test, so nothing here touches a real settings file.
      - name: Test
        working-directory: python
        env:
          PYTHONPATH: tests
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: python -m pytest tests -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No rustfmt or clippy gate: the crate has never been rustfmt-formatted, so
      # `cargo fmt --check` fails today on line wrapping alone. Enforcing it is a
      # decision to make deliberately, with a one-time reformat commit of its
      # own - not something to discover as a red first CI run.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri

      # The same list rust/packaging/setup tells a developer to install. Only
      # Linux needs it: macOS uses WKWebView and Windows WebView2, both part of
      # the operating system.
      - name: Webview development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # cargo build before cargo test, so a compile error on this platform is
      # reported as a compile error rather than buried in test output. This is
      # the check that would have caught RunEvent::Opened, which exists only on
      # macOS and made the crate uncompilable everywhere else for ten days.
      - name: Build
        working-directory: rust/src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: rust/src-tauri
        run: cargo test --locked

  # The heaviest job by dependency - Qt 6 with WebEngine is a gigabyte-scale
  # install - but not by time: cached, it finishes alongside the others. It was
  # briefly a workflow of its own on the theory that a Python change should not
  # wait behind it, which was simply wrong about Actions. Jobs run in parallel
  # across workflows as well as within one, so the split bought no speed and
  # cost a second run to go and look at.
  #
  # This is the port whose tests stopped compiling on Windows for two days over
  # a preprocessor directive inside a QCOMPARE argument: undefined by the
  # standard, accepted by Clang, rejected by MSVC, with nothing to say so.
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            qt_arch: clang_64

    steps:
      # Full history: CMakeLists derives the build number from
      # `git rev-list --count HEAD`, which is 1 in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WebEngine is not part of the base install and pulls in WebChannel and
      # Positioning, exactly as cpp/README.md tells a person installing Qt by
      # hand. 6.11.1 is what the ports are developed against, and testing the Qt
      # that ships is the point.
      #
      # aqtsource, rather than the released aqtinstall, because Qt 6.11
      # reorganised its Windows repository - packages moved out of a combined
      # qt6_6111/qt6_6111/ directory into per-architecture ones - and released
      # aqtinstall still asks for the old path and gets a 404. The fix is
      # miurahr/aqtinstall#1000, merged 2026-03-24, and there has been no
      # release since 3.3.0 in June 2025 to carry it. Pinned to the merge commit
      # rather than a branch or a PR ref, so it cannot drift, and applied on
      # every platform so all three install Qt with the same tool.
      #
      # Briefly the Windows job ran Qt 6.10.0 instead. That worked, but it meant
      # testing a Qt we do not ship, and 6.10.0 segfaults QtWebEngine's GL setup
      # on a headless Linux runner, so it could not be used everywhere either.
      #
      # .github/workflows/aqt-release-watch.yml says when this can become a
      # plain `aqtversion: '>=3.4'`.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt_arch }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # QtWebEngine is Chromium, and it links against a wide set of system
      # libraries that a headless runner does not have. The offscreen platform
      # avoids needing a display; it does not avoid needing these.
      - name: System libraries for QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libasound2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libpango-1.0-0

      # The same fetch cpp/packaging/setup performs. Done here rather than by
      # running setup because setup verifies a developer's whole environment and
      # would report on things a runner arranges differently; this is the one
      # piece of it a build actually needs. CMakeLists compiles these sources
      # in-tree when no system md4c is present.
      - name: Fetch md4c
        run: git clone --depth 1 https://github.com/mity/md4c.git cpp/third_party/md4c

      - name: Configure
        run: cmake -B cpp/build -S cpp

      - name: Build
        run: cmake --build cpp/build --config Release

      # ctest supplies the offscreen platform, the sandbox flags and - since the
      # tests drive the real MainWindow, which records every document it opens -
      # a settings file inside the build tree, so nothing writes anywhere real.
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
